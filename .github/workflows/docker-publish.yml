name: Docker Image CI

on:
  push:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
  
    - name: Fetch tags
      run: git fetch --tags

    - name: Get latest tag
      id: get_latest_tag
      run: echo "latest_tag=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
      with:
        platforms: linux/arm64, linux/amd64

    - name: Set up buildx
      uses: docker/setup-buildx-action@v2
      with:
        install: true
        buildkitd-flags: --debug

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image for api
      uses: docker/build-push-action@v4
      with:
          context: .
          file: src-docker/WeddingRsvp.Api/Dockerfile
          push: true
          platforms: linux/arm64, linux/amd64
          tags: |
            luckyluke4411/weddingrsvp-api:latest
            luckyluke4411/weddingrsvp-api:${{ env.latest_tag }}

    - name: Build and push Docker image for webapp
      uses: docker/build-push-action@v4
      with:
        context: .
        file: src-docker/WeddingRsvp.WebApp/Dockerfile
        push: true
        platforms: linux/arm64, linux/amd64
        tags: |
          luckyluke4411/weddingrsvp-WebApp:latest
          luckyluke4411/weddingrsvp-WebApp:${{ env.latest_tag }}